services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/app/chroma_data
    env_file:
      - .env
    environment:
      - MODEL_PROVIDER=${MODEL_PROVIDER:-gemini}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.5-flash}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
